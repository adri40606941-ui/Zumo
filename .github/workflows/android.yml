name: Compilar app Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', '.gitmodules', 'bot/marca.py']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK y NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clave de firma (se crea una sola vez y se reutiliza)
        uses: actions/cache@v4
        with:
          path: ks
          key: zumo-keystore-v1

      # Firma fija: si existen los secretos ZUMO_KEYSTORE_B64 y ZUMO_KS_PASS se usan siempre (la
      # clave nunca se pierde). Si no, se usa la del caché (como antes). Si existe
      # ZUMO_EXPORT_PASS (lo pone el bot un momento), la clave en uso se exporta cifrada con esa
      # contraseña: para guardarla como secreto fijo o para llevarla a otra VPS.
      - name: Preparar firma
        id: firma
        env:
          KS_B64: ${{ secrets.ZUMO_KEYSTORE_B64 }}
          KS_PASS_FIJA: ${{ secrets.ZUMO_KS_PASS }}
          EXPORT_PASS: ${{ secrets.ZUMO_EXPORT_PASS }}
        run: |
          mkdir -p ks
          FIJA=no
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_FIJA" ]; then
            printf '%s' "$KS_B64" | base64 -d > ks/zumo.jks
            printf '%s' "$KS_PASS_FIJA" > ks/pass
            FIJA=si
            echo "Firma: secreto fijo"
          elif [ ! -f ks/zumo.jks ]; then
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore ks/zumo.jks -storepass "$P" -keypass "$P" -alias zumo \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Zumo VPN"
            echo "$P" > ks/pass
            echo "Firma: clave nueva en el caché"
          else
            echo "Firma: clave del caché"
          fi
          echo "ZUMO_KEYSTORE=$PWD/ks/zumo.jks" >> "$GITHUB_ENV"
          echo "ZUMO_KS_PASS=$(cat ks/pass)" >> "$GITHUB_ENV"
          echo "fija=$FIJA" >> "$GITHUB_OUTPUT"
          EXPORTAR=no
          if [ -n "$EXPORT_PASS" ]; then
            mkdir -p clave-export
            tar -C ks -cf - zumo.jks pass | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:EXPORT_PASS -out clave-export/clave-firma.enc
            EXPORTAR=si
          fi
          echo "exportar=$EXPORTAR" >> "$GITHUB_OUTPUT"

      - name: Exportar clave de firma cifrada (la recoge el bot)
        if: steps.firma.outputs.exportar == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: clave-firma
          path: clave-export/clave-firma.enc
          retention-days: 1

      # Lista de servidores de la app. Por defecto sale de android/servidores.txt; si existe el
      # secreto ZUMO_SERVIDORES se usa ese texto (mismo formato) y nada queda a la vista en el repo.
      - name: Servidores de la app (secreto opcional)
        env:
          ZUMO_SERVIDORES: ${{ secrets.ZUMO_SERVIDORES }}
          ZUMO_URL_VPS: ${{ secrets.ZUMO_URL_ACTUALIZAR }}
        run: |
          if [ -n "$ZUMO_SERVIDORES" ]; then
            printf '%s\n' "$ZUMO_SERVIDORES" > android/servidores.txt
            echo "Lista de servidores: secreto ZUMO_SERVIDORES"
          else
            echo "Lista de servidores: android/servidores.txt"
          fi
          echo "Servidores cargados: $(grep -c '^[[:space:]]*\[[^]=[]\+\][[:space:]]*$' android/servidores.txt || true)"
          # Botón ↻ de la app: se hornea la URL de donde baja la lista (la rama donde se publica este build)
          # y se deja servidores.bin listo para subir a esa rama (así una app recién compilada ya puede actualizar).
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then RAMA=apk; else RAMA=apk-prueba; fi
          # Si el bot tiene dominio propio, el secreto ZUMO_URL_ACTUALIZAR trae la lista completa de direcciones
          # (separadas por "|": primero la VPS y, si no es privado el repo, GitHub de respaldo). Sin él, solo GitHub.
          URL_GH="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RAMA}/servidores.bin"
          if [ -n "$ZUMO_URL_VPS" ]; then URL_GH="${ZUMO_URL_VPS}"; fi
          echo "ZUMO_ACTUALIZAR_URL=${URL_GH}" >> "$GITHUB_ENV"
          pip install --quiet cryptography
          mkdir -p out
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "bot")
          import zs
          with open("android/servidores.txt", encoding="utf-8") as f:
              texto = f.read()
          with open("out/servidores.bin", "wb") as f:
              f.write(zs.cifrar_lista(texto))
          PY

      # Apariencia de la app (nombre, colores, letra, ícono, fondo). Por defecto sale de android/marca.
      # Si el bot subió una, viene partida en los secretos ZUMO_MARCA (cabecera) y ZUMO_MARCA_1..14
      # (un secreto guarda como mucho 48 KB); bot/marca.py las junta y reemplaza android/marca.
      - name: Apariencia de la app (secreto opcional)
        env:
          ZUMO_MARCA: ${{ secrets.ZUMO_MARCA }}
          ZUMO_MARCA_1: ${{ secrets.ZUMO_MARCA_1 }}
          ZUMO_MARCA_2: ${{ secrets.ZUMO_MARCA_2 }}
          ZUMO_MARCA_3: ${{ secrets.ZUMO_MARCA_3 }}
          ZUMO_MARCA_4: ${{ secrets.ZUMO_MARCA_4 }}
          ZUMO_MARCA_5: ${{ secrets.ZUMO_MARCA_5 }}
          ZUMO_MARCA_6: ${{ secrets.ZUMO_MARCA_6 }}
          ZUMO_MARCA_7: ${{ secrets.ZUMO_MARCA_7 }}
          ZUMO_MARCA_8: ${{ secrets.ZUMO_MARCA_8 }}
          ZUMO_MARCA_9: ${{ secrets.ZUMO_MARCA_9 }}
          ZUMO_MARCA_10: ${{ secrets.ZUMO_MARCA_10 }}
          ZUMO_MARCA_11: ${{ secrets.ZUMO_MARCA_11 }}
          ZUMO_MARCA_12: ${{ secrets.ZUMO_MARCA_12 }}
          ZUMO_MARCA_13: ${{ secrets.ZUMO_MARCA_13 }}
          ZUMO_MARCA_14: ${{ secrets.ZUMO_MARCA_14 }}
        run: |
          python3 bot/marca.py android/marca || {
            mkdir -p out
            echo "error: la apariencia que subió el bot llegó incompleta o dañada. Compilá de nuevo desde el bot." > out/compilacion.log
            exit 1
          }

      - name: Pruebas del túnel (SSH + WebSocket + SOCKS)
        continue-on-error: true
        run: |
          mkdir -p out
          set -o pipefail
          gradle -p android testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee out/pruebas-completo.log | grep -E "^e: |FAILED|PASSED|tests completed|BUILD|Test.*>|AssertionError|Exception" | head -n 120 | tee out/pruebas.log
          cp -r android/app/build/test-results/testDebugUnitTest out/resultados 2>/dev/null || true

      - name: Compilar
        id: compilar
        continue-on-error: true
        run: |
          mkdir -p out
          set -o pipefail
          # versionCode = minutos desde 2025-01-01 (UTC). Es la misma cuenta que usa el bot al compilar en la VPS
          # (bot/compilar_vps.py), así un APK de GitHub y otro de la VPS siempre se instalan uno encima del otro.
          export ZUMO_VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          echo "versionCode $ZUMO_VERSION_CODE"
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee out/compilacion-completa.log | grep -E "^e: |FAILED|BUILD|error:|Exception" | head -n 150 | tee out/compilacion.log

      # Celulares con páginas de 16 KB (Android 15+): la parte nativa tiene que ir alineada. Solo avisa.
      - name: Comprobar compatibilidad con páginas de 16 KB
        if: steps.compilar.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p out
          python3 android/comprobar-16kb.py android/app/build/outputs/apk/release/*.apk 2>&1 | tee out/alineacion-16kb.log

      - uses: actions/upload-artifact@v4
        if: steps.compilar.outcome == 'success'
        with:
          name: zumo-vpn-apk
          path: android/app/build/outputs/apk/release/*.apk

      # main publica en la rama "apk" (la que descargan los clientes); cualquier otra rama
      # publica en "apk-prueba", así una prueba nunca pisa el APK publicado.
      - name: Publicar APK (o registros, si falló) en la rama apk
        if: always()
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then DESTINO=apk; else DESTINO=apk-prueba; fi
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/zumo-vpn.apk 2>/dev/null || true
          cd out
          rm -f resultados/binary 2>/dev/null || true
          git init -q
          git checkout -q -b "$DESTINO"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Compilación ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DESTINO"

      - name: Fallar si no compiló
        if: steps.compilar.outcome != 'success'
        run: exit 1
