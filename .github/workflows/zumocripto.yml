name: Compilar Zumo Cripto

on:
  push:
    branches: [main, zumocripto-app]
    paths: ['zumocripto/**', '.github/workflows/zumocripto.yml']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # La firma tiene que ser siempre la misma para que cada APK nuevo se instale encima del anterior:
      # se crea una vez, se guarda en el caché de GitHub y se reutiliza.
      - name: Clave de firma (se crea una sola vez y se reutiliza)
        uses: actions/cache@v4
        with:
          path: ks-cripto
          key: zumocripto-keystore-v1

      # Si existen los secretos ZUMO_KEYSTORE_B64 y ZUMO_KS_PASS (los mismos de Zumo VPN y Zumo Port) se usa esa clave fija y nunca se pierde.
      # Si no, se usa la del caché de GitHub (que se borra tras 7 días sin compilar: ahí el próximo APK tendría otra firma).
      - name: Preparar firma
        env:
          KS_B64: ${{ secrets.ZUMO_KEYSTORE_B64 }}
          KS_PASS_FIJA: ${{ secrets.ZUMO_KS_PASS }}
        run: |
          mkdir -p ks-cripto
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_FIJA" ]; then
            printf '%s' "$KS_B64" | base64 -d > ks-cripto/zumo.jks
            printf '%s' "$KS_PASS_FIJA" > ks-cripto/pass
            echo "Firma: secreto fijo"
          elif [ ! -f ks-cripto/zumo.jks ]; then
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore ks-cripto/zumo.jks -storepass "$P" -keypass "$P" -alias zumo \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Zumo Cripto"
            echo "$P" > ks-cripto/pass
            echo "Firma: clave nueva en el caché"
          else
            echo "Firma: clave del caché"
          fi
          echo "ZUMO_KEYSTORE=$PWD/ks-cripto/zumo.jks" >> "$GITHUB_ENV"
          echo "ZUMO_KS_PASS=$(cat ks-cripto/pass)" >> "$GITHUB_ENV"

      - name: Pruebas
        run: gradle -p zumocripto testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar
        run: |
          export ZUMO_VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          echo "versionCode $ZUMO_VERSION_CODE"
          gradle -p zumocripto assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zumo-cripto-apk
          path: zumocripto/app/build/outputs/apk/release/*.apk

      # main publica en la rama "apk-cripto"; cualquier otra rama en "apk-cripto-prueba".
      - name: Publicar APK en la rama apk-cripto
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then DESTINO=apk-cripto; else DESTINO=apk-cripto-prueba; fi
          mkdir -p out
          cp zumocripto/app/build/outputs/apk/release/*.apk out/zumo-cripto.apk
          cd out
          git init -q
          git checkout -q -b "$DESTINO"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Zumo Cripto ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DESTINO"
