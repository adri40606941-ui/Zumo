name: Sonda temporal de APIs de exchanges
on:
  push:
    branches: [zumocripto-fuentes]
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Pedir cada endpoint
        run: |
          mkdir -p out
          : > out/sonda.txt
          for u in \
            "https://api.binance.com/api/v3/ticker/24hr" \
            "https://api.bybit.com/v5/market/tickers?category=spot" \
            "https://www.okx.com/api/v5/market/tickers?instType=SPOT" \
            "https://api.kucoin.com/api/v1/market/allTickers" \
            "https://api.gateio.ws/api/v4/spot/tickers" \
            "https://api.bitget.com/api/v2/spot/market/tickers" \
            "https://api.mexc.com/api/v3/ticker/24hr" ; do
            echo "===== $u" >> out/sonda.txt
            curl -s -m 60 -o /tmp/r.json -w "HTTP %{http_code} bytes %{size_download}\n" "$u" >> out/sonda.txt
            head -c 900 /tmp/r.json >> out/sonda.txt; echo >> out/sonda.txt; echo >> out/sonda.txt
          done
      - name: Publicar resultado en la rama sonda-salida
        run: |
          cd out && git init -q && git checkout -q -b sonda-salida && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "sonda"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-salida
