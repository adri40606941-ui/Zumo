name: Sonda temporal de mas exchanges
on:
  push:
    branches: [zumocripto-mas-exchanges]
jobs:
  sonda:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Pedir cada endpoint
        run: |
          mkdir -p out
          : > out/sonda.txt
          for u in \
            "https://api.huobi.pro/market/tickers" \
            "https://api.crypto.com/exchange/v1/public/get-tickers" \
            "https://api.kraken.com/0/public/Ticker" \
            "https://api.bitget.com/api/v2/spot/market/tickers" \
            "https://api.lbkex.com/v2/ticker/24hr.do?symbol=all" \
            "https://api.bitmart.com/spot/quotation/v3/tickers" \
            "https://api.whitebit.com/api/v4/public/ticker" \
            "https://sapi.xt.com/v4/public/ticker/24h" \
            "https://api.poloniex.com/markets/ticker24h" \
            "https://api.coinex.com/v2/spot/ticker" \
            "https://api-pub.bitfinex.com/v2/tickers?symbols=ALL" \
            "https://api.bingx.com/openApi/spot/v1/ticker/24hr" \
            "https://api.phemex.com/md/spot/ticker/24hr/all" \
            "https://api.exchange.coinbase.com/products/BTC-USD/ticker" \
            "https://www.bitstamp.net/api/v2/ticker/" \
            "https://api.gemini.com/v1/pricefeed" \
            "https://ascendex.com/api/pro/v1/spot/ticker" \
            "https://api.probit.com/api/exchange/v1/ticker" ; do
            echo "===== $u" >> out/sonda.txt
            curl -s -m 60 -o /tmp/r.json -w "HTTP %{http_code} bytes %{size_download}\n" "$u" >> out/sonda.txt
            head -c 700 /tmp/r.json >> out/sonda.txt; echo >> out/sonda.txt; echo >> out/sonda.txt
          done
      - name: Publicar resultado
        run: |
          cd out && git init -q && git checkout -q -b sonda-salida && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "sonda mas exchanges"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-salida
