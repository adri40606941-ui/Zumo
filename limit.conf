# Configuración del limitador (zumo-limit).
# El limitador relee este archivo en cada vuelta: no hace falta reiniciarlo.
# Si borrás una línea, vale el valor por defecto que figura acá.

# Segundos entre revisiones (1 a 60).
INTERVAL=3

# Segundos que una sesión de más puede quedar conectada antes de cortarla.
# 0 = se corta en la siguiente revisión (como mucho INTERVAL segundos).
# Con KICK=newest conviene subirlo (por ejemplo 20) si tus clientes cambian de
# red y reconectan seguido: la sesión vieja tarda hasta ~30 s en darse por caída
# y mientras tanto la nueva cuenta como "segunda conexión".
GRACE=0

# Qué sesión se corta cuando hay de más:
#   oldest = la vieja (quien reconecta tras perder la señal entra enseguida; la
#            sesión caída, que el servidor tarda ~30 s en notar, es la que se corta)
#   newest = la nueva (el segundo dispositivo no entra; la primera sigue)
KICK=oldest

# Hora (0 a 23, hora de la VPS) del día de vencimiento en que se corta al usuario.
# Con 21, un usuario que vence el 24/10 se corta ese día a las 21:00.
EXPIRE_HOUR=21

# 1 = al llegar esa hora el usuario se BORRA (cuenta y fila de la base).
# 0 = solo se le cortan las sesiones y la cuenta queda para renovarla.
EXPIRE_DELETE=1

# 1 = el limitador borra los usuarios temporales cuyo tiempo ya pasó
# (cubre el caso de que el timer de systemd se pierda al reiniciar la VPS).
TEMP_CLEANUP=1
