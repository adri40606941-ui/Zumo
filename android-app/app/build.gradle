plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zumo.tunnel'
    compileSdk 34

    defaultConfig {
        applicationId "com.zumo.tunnel"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // ABIs para las que tenés que proveer los .so en jniLibs/
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // badvpn se corre como ejecutable desde nativeLibraryDir: hay que
    // extraerlo del APK (no dejarlo comprimido dentro).
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Maintained JSch fork (pure-Java SSH) from Maven Central
    implementation 'com.github.mwiede:jsch:0.2.21'
}
